name: CD - Android Internal Testing

on:
  workflow_dispatch:
    inputs:
      submit_to_play:
        description: Submit the completed build to Google Play Internal Testing
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: elekha-android-internal-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Expo Doctor
        run: npx expo-doctor

      - name: Run lint
        run: npm run lint

      - name: Run type checking
        run: npm run typecheck

      - name: Run theme color validation
        run: npm run check:theme-colors

      - name: Run tests
        run: npm test

      - name: Resolve Expo configuration
        run: npx expo config --type public

      - name: Validate Android export
        run: npx expo export --platform android --output-dir dist-release-check

  build:
    name: Build Android App Bundle
    needs:
      - validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: google-play-internal

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Confirm Expo authentication
        run: eas whoami

      - name: Build Android production App Bundle
        run: eas build --platform android --profile production --non-interactive --wait

  submit:
    name: Submit to Google Play Internal Testing
    needs:
      - build
    if: ${{ inputs.submit_to_play == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: google-play-internal

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Submit latest production build
        run: eas submit --platform android --profile production --latest --non-interactive
